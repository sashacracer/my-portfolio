name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Приветствие
        run: echo "Проверка учебного портфолио запущена"
      - name: Проверка обязательных файлов
        run: |
          test -s index.html
          test -s styles.css
          test -s SECURITY.md
      - name: Проверка базовой структуры HTML
        run: |
          grep -qi '<!doctype html>' index.html
          grep -qi '<title>' index.html
          grep -qi '<main' index.html
